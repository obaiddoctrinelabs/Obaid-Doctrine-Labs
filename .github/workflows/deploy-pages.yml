name: Deploy Obaid Doctrine Labs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js for static quality checks
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static quality checks before deployment
        run: node scripts/check-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Node.js for live smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright for live smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify deployed website on mobile viewport
        env:
          ODL_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/browser-smoke.mjs
